  <path
    d="M10 10L16 16L10 22"
    stroke="#0B0B0C"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M18.5 22H23"
    stroke="#0B0B0C"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
